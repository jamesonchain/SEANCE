[package]
name = "seance-auction"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic sealed-bid auction rules for the SEANCE Tari adapter"

[features]
default = []
tari-template = ["dep:tari_template_lib", "dep:minicbor"]

[dependencies]
sha2 = "0.10"
tari_template_lib = { version = "0.35.0", optional = true }
minicbor = { version = "2.3.1", optional = true }

[lib]
path = "src/lib.rs"
